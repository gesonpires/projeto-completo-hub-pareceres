name: Web CI

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hub_pareceres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hub_pareceres_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: web

    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hub_pareceres_test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Rodar testes unitários
        run: npm test

      - name: Rodar testes de integração
        run: npm run test:integration