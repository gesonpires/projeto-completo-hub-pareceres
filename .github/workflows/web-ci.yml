# CI do app Next.js em `web/`: testes unitários (Vitest) + integração (Postgres).
name: Web CI

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hub_pareceres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hub_pareceres_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hub_pareceres_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Unit tests
        run: npm test

      - name: Integration tests (runImportacaoCsv)
        run: npm run test:integration
